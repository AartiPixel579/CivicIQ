services:
  - type: web
    name: civiciq-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: VECTOR_STORE_PROVIDER
        value: pgvector
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LLM_PRIMARY_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: TRUSTED_ROOT_URL
        value: https://www.edisonnj.org/document_center/index.php
      - key: CRAWL_MAX_DEPTH
        value: "2"
      - key: CRAWL_DELAY_SECONDS
        value: "0.5"
      - key: CRAWL_TIMEOUT_SECONDS
        value: "15"
      - key: CRAWL_MAX_PDF_MB
        value: "20"
      - key: CRAWL_MISS_THRESHOLD
        value: "2"
